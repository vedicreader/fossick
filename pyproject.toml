[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fossick"
dynamic = ["version"]
description = "Web search, fetch, crawl, and browser automation for humans and agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "curl-cffi>=0.15.0",
    "ddgs>=9.14.4",
    "diskcache>=5.6.3",
    "fastcdp>=0.0.5",
    "fastcore>=1.12.31",
    "html2text>=2025.4.15",
    "liteparse>=2.1.1",
    "pdf-oxide>=0.3.67",
    "readability-lxml>=0.8.4.1",
    "resiliparse>=1.0.9",
    "scrapling[fetchers]>=0.4.8",
    "yt-dlp>=2026.3.17",
    "mcp>=1.2.0,<2",
    "certifi>=2026.7.22",
]

[project.optional-dependencies]
# Cross-encoder reranking for search()/rerank(method='flashrank'). RRF is the default (method='none');
# lexical (BM25) needs nothing extra; flashrank adds a ~4MB ONNX model for +0.04 P@3 on our benchmark.
rerank = ["flashrank>=0.2.10"]

[project.urls]
Repository = "https://github.com/vedicreader/fossick"
Documentation = "https://vedicreader.github.io/fossick/"

[project.scripts]
fossick = "fossick.cli:main"
fossick-mcp = "fossick.mcp:main"

[project.entry-points.nbdev]
fossick = "fossick._modidx:d"

[tool.hatch.version]
path = "fossick/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fossick"]

[tool.hatch.build.targets.sdist]
include = [
    "/fossick",
    "/examples",
    "/README.md",
    "/pyproject.toml",
]

[tool.nbdev]

[tool.uv.sources]
fossick = { workspace = true }

[dependency-groups]
dev = [
    "certifi>=2026.7.22",
    "flashrank>=0.2.10",
    "fossick",
    "ipykernel>=7.3.0",
    "koshas>=0.0.9",
    "nbdev>=3.0.12",
    "notebook>=7.5.5",
]
